[workspace]
members = [
    "crates/scoparius-core",
    "crates/scoparius-cli",
    # "crates/scoparius-gui",  # Tauri v2 — Phase 7
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Scoparius Contributors"]
repository = "https://github.com/scoparius/scoparius"
description = "Cross-platform disk analyzer and intelligent cleanup utility"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }

# Filesystem
jwalk = "0.8"
blake3 = "1"
trash = "5"
fs-err = "3"
dirs = "6"

# System Info
sysinfo = "0.33"

# Data
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# CLI
clap = { version = "4", features = ["derive", "env", "color"] }
ratatui = "0.29"
crossterm = "0.28"
indicatif = "0.17"

# LLM
ollama-rs = "0.2"
reqwest = { version = "0.12", features = ["json"] }

# Error Handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Misc
bytesize = "1"
tabled = "0.17"
colored = "2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = 3
